[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gmail"
version = "0.1.0"
description = "Multi-tenant Gmail MCP server with OAuth hardening. Drop in for any MCP-compatible client. FastAPI, Postgres, Railway-ready."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # CVE-2026-48526: JWT auth bypass via forged tokens, fixed in 2.13.0.
    # 2.14.0 fixes the advisories Trivy reported in November 2026 (PR #34);
    # 2.15.0 fixes GHSA-42vr-xj54-vc7v and GHSA-x33g-cr3x-6449 (Moderate).
    "pyjwt[crypto]>=2.15.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # GHSA-537c-gmf6-5ccf: vulnerable OpenSSL bundled in wheels, fixed in 48.0.1.
    # CVE-2026-69247 (PKCS7 decrypt oracle) fixed in 50.0.0 (PR #34).
    "cryptography>=50.0.0",
    "jsonschema>=4.21",
    # HTML -> readable text for read_email/get_thread format='text' (the
    # text/html fallback when a message has no text/plain part). MIT, and
    # its transitives (beautifulsoup4, soupsieve, six) are MIT/PSF, so it
    # is license-clean for this MIT project. Free, no API key, no network.
    "markdownify>=1.2.3",
    # starlette arrives transitively via fastapi; pin the floor directly to
    # force the security-fixed release. CVE-2026-48818 (SSRF/NTLM via UNC in
    # StaticFiles) fixed in 1.1.0; CVE-2026-54283 (form() DoS) fixed in 1.3.1.
    "starlette>=1.3.1",
    # Transitive, pinned for security fixes the same way as starlette. anyio via
    # starlette and httpx: CVE-2026-63374, fixed in 4.14.2. certifi via httpx:
    # GHSA-6q48-6c7w-9gw2, fixed in 2026.10.18. idna via httpx: GHSA-65pc-fj4g-8rjx,
    # fixed in 3.15. soupsieve via markdownify: GHSA-gjv8-xp57-g29c and
    # GHSA-j934-xhv5-fg8f, fixed in 2.9.0. mako via alembic: GHSA-5639-2j2p-m4mx,
    # fixed in 1.4.2.
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "idna>=3.15",
    "soupsieve>=2.9.0",
    "mako>=1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=mcp_gmail --cov-report=term --cov-fail-under=80"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["mcp_gmail"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
